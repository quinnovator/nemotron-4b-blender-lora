<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker></defs>
<rect x="16" y="16" width="440" height="388" rx="14" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="36" y="44" font-size="15" font-weight="600" fill="#e6edf3">NeMo RL container</text>
<text x="36" y="64" font-size="12" fill="#9198a1">one RTX 4090 · no Docker socket</text>
<rect x="46" y="86" width="330" height="62" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="211.0" y="113.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">GRPO policy: Megatron + LoRA r32</text>
<text x="211.0" y="132.0" font-size="12" fill="#9198a1" text-anchor="middle">Nemotron 3 Nano 4B, frozen base in bf16</text>
<rect x="46" y="196" width="330" height="62" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="211.0" y="223.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">vLLM rollouts (colocated)</text>
<text x="211.0" y="242.0" font-size="12" fill="#9198a1" text-anchor="middle">4 prompts × 8 samples per step</text>
<rect x="46" y="306" width="330" height="70" rx="10" fill="#0d1117" stroke="#1aa679" stroke-width="1.5"/>
<text x="211.0" y="337.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">NeMo Gym: blender_scene</text>
<text x="211.0" y="356.0" font-size="12" fill="#9198a1" text-anchor="middle">extract code → run → score the scene</text>
<line x1="211" y1="150" x2="211" y2="194" stroke="#9198a1" stroke-width="1.6" marker-end="url(#head)"/>
<text x="221" y="177" font-size="12" fill="#9198a1" text-anchor="start">LoRA weights</text>
<line x1="211" y1="260" x2="211" y2="304" stroke="#9198a1" stroke-width="1.6" marker-end="url(#head)"/>
<text x="221" y="287" font-size="12" fill="#9198a1" text-anchor="start">32 scripts</text>
<path d="M376,320 H416 V117 H380" fill="none" stroke="#9198a1" stroke-width="1.6" marker-end="url(#head)"/>
<text x="424" y="222" font-size="12" fill="#9198a1" transform="rotate(-90 424 222)" text-anchor="middle">rewards</text>
<text x="520" y="44" font-size="15" font-weight="600" fill="#e6edf3">Host</text>
<rect x="500" y="300" width="190" height="82" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<text x="595.0" y="337.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Sandbox broker</text>
<text x="595.0" y="356.0" font-size="12" fill="#9198a1" text-anchor="middle">127.0.0.1:8765</text>
<line x1="378" y1="334" x2="498" y2="334" stroke="#9198a1" stroke-width="1.6" marker-end="url(#head)"/>
<text x="470" y="326" font-size="12" fill="#9198a1" text-anchor="middle">bpy code</text>
<line x1="498" y1="360" x2="378" y2="360" stroke="#9198a1" stroke-width="1.6" marker-end="url(#head)"/>
<text x="470" y="378" font-size="12" fill="#9198a1" text-anchor="middle">scene</text>
<rect x="740" y="86" width="190" height="150" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<rect x="750" y="100" width="190" height="150" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
<rect x="760" y="114" width="190" height="150" rx="10" fill="#0d1117" stroke="#e275ad" stroke-width="1.5"/>
<text x="855" y="146" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Blender 5.2 sandbox</text>
<text x="855" y="165" font-size="12" fill="#9198a1" text-anchor="middle">one container per script</text>
<text x="855" y="198" font-size="12" fill="#9198a1" text-anchor="middle">no network · read-only</text>
<text x="855" y="216" font-size="12" fill="#9198a1" text-anchor="middle">2 GB · 1 CPU · 128 pids</text>
<text x="855" y="234" font-size="12" fill="#9198a1" text-anchor="middle">40 s limit · non-root</text>
<line x1="692" y1="322" x2="790" y2="268" stroke="#9198a1" stroke-width="1.6" marker-end="url(#head)"/>
<text x="760" y="300" font-size="12" fill="#9198a1"><tspan x="760" dy="0">Run the script, save the scene,</tspan><tspan x="760" dy="17">then a second, clean Blender</tspan><tspan x="760" dy="17">measures every mesh: the script</tspan><tspan x="760" dy="17">can never write its own score.</tspan></text>
</svg>
