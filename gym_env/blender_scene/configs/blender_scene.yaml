blender_scene:
  resources_servers:
    blender_scene:
      entrypoint: app.py
      domain: coding
      verified: false
      description: Write Blender Python that builds a described scene; checked against the real scene state
      broker_url: http://127.0.0.1:8765
      episode_timeout_s: 40
      max_concurrent_episodes: 16
      reward_weights:
        ran: 0.1
        checks: 0.5
        full: 0.4
blender_scene_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: blender_scene
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/blender_scene/data/train.jsonl
        license: Apache 2.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/blender_scene/data/example.jsonl
        license: Apache 2.0
